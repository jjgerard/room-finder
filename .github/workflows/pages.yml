name: Deploy site to GitHub Pages

# Publishes docs/ to GitHub Pages.
#
# Pages must be switched on once by hand: Settings → Pages → Source:
# "GitHub Actions". The configure-pages step below asks for it with
# `enablement: true`, but the Actions GITHUB_TOKEN is not allowed to create a
# Pages site ("Resource not accessible by integration") — that endpoint needs
# repo-admin rights the workflow token does not carry. The request is left in
# so the workflow works unattended wherever the token is permitted; until
# then the build fails here, which is the intended signal.
#
# It also runs the solver's tests first, so a deploy never ships a site whose
# constraint code is broken. The site re-checks the timetable in the visitor's
# browser, so a broken checker would be visible on the front page.

on:
  push:
    branches:
      - main
      # The work currently lives on a development branch; deploying from it
      # means the site is live before the branch is merged. Drop this line once
      # it is on main.
      - claude/upbeat-volta-azwnt1
    paths:
      - 'docs/**'
      - 'timetable/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one halfway: a cancelled deploy can
# leave the live site on a half-uploaded version.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the solver tests
        run: node timetable/test.js

      - name: Check docs/assets copies match timetable/lib
        # docs/assets/constraints.js and suggest.js are generated by
        # `node timetable/export.js`. If someone edits a copy instead of the
        # original, the site and the solver quietly disagree about the rules.
        run: |
          node timetable/export.js
          if ! git diff --quiet -- docs/assets docs/data/timetable.json; then
            echo "::error::docs/ is out of date. Run 'node timetable/export.js' and commit the result."
            git diff --stat -- docs/assets docs/data/timetable.json
            exit 1
          fi

      - uses: actions/configure-pages@v5
        with:
          # Asks GitHub to turn Pages on if it is not already configured.
          # Succeeds only where the token has repo-admin rights; see the note
          # at the top of this file.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
