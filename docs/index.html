<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belfast Timetable</title>
<meta name="description" content="Autumn 2026, Spring 2026 as it stands, and a rebuilt Spring 2026 that satisfies every hard constraint — searchable by programme.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%2316233d%27/%3E%3Cpath d=%27M9 8v10a7 7 0 0 0 14 0V8%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%273%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="appbar">
  <span class="mark" aria-hidden="true"></span>
  <h1>Belfast Timetable</h1>
  <nav>
    <a href="index.html" aria-current="page">Timetable</a>
    <a href="explore.html">Explore moves</a>
  </nav>
</header>

<div class="tabs" id="tabs" role="tablist"></div>

<main class="wrap">

  <div id="banner"></div>

  <div class="card pad" id="filters" style="margin-bottom:16px">
    <div class="ms" id="ms-prog">
      <label class="fld" for="in-prog">Programme <span class="muted" style="font-weight:400">— start here; tick as many as you like</span></label>
      <div class="box"><input id="in-prog" type="search" placeholder="Type a degree, or click to browse…" autocomplete="off" role="combobox" aria-expanded="false"></div>
      <div class="drop" role="listbox" aria-multiselectable="true"></div>
    </div>
    <div class="grid3" style="margin-top:14px">
      <div class="ms" id="ms-mod">
        <label class="fld" for="in-mod">Module</label>
        <div class="box"><input id="in-mod" type="search" placeholder="Code or title…" autocomplete="off" role="combobox" aria-expanded="false"></div>
        <div class="drop" role="listbox" aria-multiselectable="true"></div>
      </div>
      <div class="ms" id="ms-room">
        <label class="fld" for="in-room">Room</label>
        <div class="box"><input id="in-room" type="search" placeholder="e.g. BC-03…" autocomplete="off" role="combobox" aria-expanded="false"></div>
        <div class="drop" role="listbox" aria-multiselectable="true"></div>
      </div>
      <div>
        <label class="fld" for="f-week">Week</label>
        <select id="f-week"><option value="">All weeks</option></select>
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <span class="small muted" style="font-weight:600">Day</span>
      <div class="chips" id="f-days"></div>
      <div class="chips" id="f-flags">
        <button class="chip" data-f="changed" aria-pressed="false" id="chip-changed" hidden>Moved only</button>
        <button class="chip" data-f="split" aria-pressed="false" id="chip-split" hidden>Split across rooms</button>
      </div>
      <button id="f-clear" style="margin-left:auto">Clear all</button>
    </div>
  </div>

  <div class="row" style="margin-bottom:12px">
    <p class="small" id="summary" style="margin:0;min-height:20px"></p>
    <div class="chips" style="margin-left:auto" role="group" aria-label="View">
      <button class="chip" id="v-grid" aria-pressed="true">Week grid</button>
      <button class="chip" id="v-list" aria-pressed="false">List</button>
    </div>
  </div>

  <div id="view-grid">
    <div class="card gridcard"><div id="grid"></div></div>
    <div class="legend">
      <span class="k"><span class="tag t-general"></span>General</span>
      <span class="k"><span class="tag t-computer"></span>Computer lab</span>
      <span class="k"><span class="tag t-specialist"></span>Specialist</span>
      <span class="k"><span class="tag t-theatre"></span>Theatre</span>
      <span class="k" id="legend-extra" style="margin-left:auto"></span>
    </div>
  </div>

  <div id="view-list" hidden>
    <div class="card" style="overflow:hidden"><div class="scroll"><table id="lst"><thead></thead><tbody></tbody></table></div></div>
    <p class="small muted" id="listnote"></p>
  </div>

  <!-- ===================== Method tab ===================== -->
  <div id="method" hidden></div>

</main>

<div id="tip" role="tooltip"></div>

<footer>
  <div class="wrap">
    Autumn and current-Spring bookings are shown one row per room, so a class split across
    rooms appears once per room. One-off <code>BK</code> bookings are excluded throughout.
    Source and solver: <a href="https://github.com/jjgerard/room-finder">jjgerard/room-finder</a>.
  </div>
</footer>

<script src="assets/model.js"></script>
<script src="assets/constraints.js"></script>
<script src="assets/method.js"></script>
<script>
(function () {
  'use strict';
  var M = window.TTModel, DAYS = M.DAYS, fmt = M.fmt;
  var TYPE_CLASS = { general: 't-general', computer: 't-computer', specialist: 't-specialist', theatre: 't-theatre' };
  var CHECK_OPTS = { dayStart: 7 * 60 + 15, dayEnd: 23 * 60 + 15 };

  // Tab order, as asked for: the two terms as they stand, the rebuild, then the
  // method. Explore moves lives on its own page, last in the nav.
  var TABS = ['autumn', 'springNow', 'springNew', 'method'];

  var H = null, tab = 'autumn', view = 'grid';
  var state = { progs: new Set(), modules: new Set(), rooms: new Set(), week: '', days: new Set(), changed: false, split: false };

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
    });
  }

  function rows() { return H.terms[tab] ? H.terms[tab].rows : []; }

  // `skip` names one filter to ignore, so each picker can count how many
  // bookings each of its options would give under the *other* filters.
  function matches(r, skip) {
    if (skip !== 'progs' && state.progs.size) {
      var hit = false;
      for (var i = 0; i < r.progs.length; i++) if (state.progs.has(r.progs[i])) { hit = true; break; }
      if (!hit) return false;
    }
    if (skip !== 'modules' && state.modules.size && !state.modules.has(r.module)) return false;
    if (skip !== 'rooms' && state.rooms.size && !state.rooms.has(r.room)) return false;
    if (state.days.size && !state.days.has(r.day)) return false;
    if (state.week && !(r.weeks & (1 << (Number(state.week) - 1)))) return false;
    if (state.changed && !r.changed) return false;
    if (state.split && !r.isSplit) return false;
    return true;
  }

  // Mark bookings that share a module, slot and weeks but sit in several rooms.
  function markSplits(term) {
    var by = new Map();
    term.rows.forEach(function (r) {
      var k = r.title + '|' + r.day + '|' + r.start + '|' + r.weeksText;
      if (!by.has(k)) by.set(k, []);
      by.get(k).push(r);
    });
    by.forEach(function (list) {
      var split = list.length > 1;
      list.forEach(function (r) { r.isSplit = split; r.splitCount = list.length; });
    });
  }

  // ---------------- week grid ----------------
  var PX = 0.74;

  function drawGrid(list) {
    var el = document.getElementById('grid');
    var weekly = list.filter(function (r) { return r.day < 5; });
    if (!weekly.length) {
      el.innerHTML = '<div class="empty"><strong>Nothing matches.</strong>Pick a programme above, or widen the filters.</div>';
      return;
    }
    if (weekly.length > 320) {
      el.innerHTML = '<div class="empty"><strong>' + weekly.length + ' bookings match.</strong>' +
        'Choose a programme or module to see the week grid, or switch to List.</div>';
      return;
    }

    // Fit the grid to what is on screen: bookings run from 07:15 to as late as
    // 23:15, so a fixed origin either clips early starts or wastes half the card.
    var lo = Infinity, hi = -Infinity;
    weekly.forEach(function (r) {
      if (r.start < lo) lo = r.start;
      if (r.start + r.dur > hi) hi = r.start + r.dur;
    });
    var T0 = Math.min(Math.floor(lo / 60) * 60, 9 * 60);
    var T1 = Math.max(Math.ceil(hi / 60) * 60, 18 * 60);
    var Hh = (T1 - T0) * PX;

    var html = '<div class="tt" style="height:' + (Hh + 32) + 'px"><div class="dh"></div>';
    for (var d = 0; d < 5; d++) html += '<div class="dh">' + DAYS[d] + '</div>';
    html += '<div class="timecol" style="height:' + Hh + 'px">';
    for (var h = T0 / 60; h <= T1 / 60; h++) {
      var y = (h * 60 - T0) * PX;
      html += '<div class="hr" style="top:' + y + 'px"></div>' +
              '<div class="hrl" style="top:' + y + 'px">' + String(h).padStart(2, '0') + ':00</div>';
    }
    html += '</div>';

    var byDay = [[], [], [], [], []];
    weekly.forEach(function (r) { byDay[r.day].push(r); });

    for (var dd = 0; dd < 5; dd++) {
      html += '<div class="daycol" style="height:' + Hh + 'px">';
      var items = byDay[dd].map(function (r) { return { r: r, s: r.start, e: r.start + r.dur }; })
        .sort(function (a, b) { return a.s - b.s || a.e - b.e; });

      // Genuine double-bookings: same room, overlapping, sharing a week, and
      // not the same booking listed twice for two rooms.
      items.forEach(function (it) { it.clash = false; });
      for (var i = 0; i < items.length; i++) {
        for (var j = i + 1; j < items.length; j++) {
          var A = items[i], B = items[j];
          if (A.r.room !== B.r.room) continue;
          if (!(A.s < B.e && B.s < A.e)) continue;
          if (!(A.r.weeks & B.r.weeks)) continue;
          if (A.r.title && A.r.title === B.r.title) continue;
          A.clash = B.clash = true;
        }
      }

      var clusters = [], cur = [], curEnd = -1;
      items.forEach(function (it) {
        if (it.s >= curEnd && cur.length) { clusters.push(cur); cur = []; curEnd = -1; }
        cur.push(it); curEnd = Math.max(curEnd, it.e);
      });
      if (cur.length) clusters.push(cur);

      clusters.forEach(function (cl) {
        var colEnd = [];
        cl.forEach(function (it) {
          for (var k = 0; k < colEnd.length; k++) {
            if (colEnd[k] <= it.s) { it.col = k; colEnd[k] = it.e; return; }
          }
          it.col = colEnd.length; colEnd.push(it.e);
        });
        var nc = colEnd.length;
        cl.forEach(function (it) {
          var r = it.r, room = H.model.rooms[it.r.room] || { name: '?', type: 'general' };
          var top = (it.s - T0) * PX, ht = Math.max((it.e - it.s) * PX - 2, 14);
          var w = 100 / nc, left = it.col * w;
          var colr = 'var(--' + (TYPE_CLASS[room.type] || 't-general') + ')';
          var chLabel = r.changed ? ['d', 't', 'r'].filter(function (x) { return r.changed.indexOf(x) >= 0; })
            .map(function (x) { return { d: 'day', t: 'time', r: 'room' }[x]; }).join(', ') : '';
          var tip = (r.module || r.activity) + ' · ' + r.activity + '\n' +
                    fmt(it.s) + '–' + fmt(it.e) + '\n' + room.name +
                    (room.capacityKnown ? ' · ' + room.capacity + ' seats' : ' · capacity not recorded') +
                    '\nWeeks ' + r.weeksText +
                    (r.isSplit ? '\nAlso in ' + (r.splitCount - 1) + ' other room' + (r.splitCount > 2 ? 's' : '') : '') +
                    (chLabel ? '\nMoved: ' + chLabel : '') +
                    '\n' + r.title;
          html += '<div class="blk' + (it.clash ? ' clash' : '') + (r.changed ? ' moved' : '') +
            '" style="top:' + top + 'px;height:' + ht + 'px;left:calc(' + left + '% + 1px);' +
            'width:calc(' + w + '% - 2px);border-left-color:' + colr + '" data-tip="' + esc(tip) + '">' +
            '<div class="m">' + esc(r.module || r.activity) + '</div>' +
            '<div class="r">' + esc(room.name) + '</div>' +
            (chLabel && ht > 32 ? '<div class="c">moved ' + chLabel + '</div>'
              : (r.isSplit && ht > 32 ? '<div class="c">+' + (r.splitCount - 1) + ' room' + (r.splitCount > 2 ? 's' : '') + '</div>' : '')) +
            '</div>';
        });
      });
      html += '</div>';
    }
    html += '</div>';
    el.innerHTML = html;
  }

  // ---------------- list ----------------
  var sortKey = 'day', sortDir = 1;
  var COLS = [['Module', 'module'], ['Title', 'title'], ['Day', 'day'], ['Start', 'start'],
              ['Length', 'dur'], ['Room', 'room'], ['Seats', 'seats'], ['Weeks', 'weeks']];

  function drawList(list) {
    var showChanged = tab === 'springNew';
    var cols = COLS.concat(showChanged ? [['Changed', 'changed']] : []);
    var th = document.querySelector('#lst thead'), tb = document.querySelector('#lst tbody');
    th.innerHTML = '<tr>' + cols.map(function (c) {
      return '<th data-k="' + c[1] + '">' + c[0] + (sortKey === c[1] ? (sortDir > 0 ? ' ▲' : ' ▼') : '') + '</th>';
    }).join('') + '</tr>';
    th.querySelectorAll('th').forEach(function (h) {
      h.onclick = function () {
        var k = h.dataset.k;
        if (k === sortKey) sortDir *= -1; else { sortKey = k; sortDir = 1; }
        render();
      };
    });

    var val = function (r) {
      var room = H.model.rooms[r.room] || {};
      switch (sortKey) {
        case 'module': return r.module || r.activity;
        case 'title': return r.title;
        case 'day': return r.day * 10000 + r.start;
        case 'start': return r.start;
        case 'dur': return r.dur;
        case 'room': return room.name || '';
        case 'seats': return room.capacity || 0;
        case 'weeks': return r.weeksText;
        case 'changed': return r.changed || '';
        default: return 0;
      }
    };
    var sorted = list.slice().sort(function (a, b) {
      var va = val(a), vb = val(b);
      return (va > vb ? 1 : va < vb ? -1 : 0) * sortDir;
    });
    var CAP = 800, show = sorted.slice(0, CAP);
    tb.innerHTML = show.map(function (r) {
      var room = H.model.rooms[r.room] || { name: '?', type: 'general' };
      var chTxt = r.changed ? ['d', 't', 'r'].filter(function (x) { return r.changed.indexOf(x) >= 0; })
        .map(function (x) { return { d: 'day', t: 'time', r: 'room' }[x]; }).join(', ') : '';
      return '<tr>' +
        '<td class="mono">' + esc(r.module || '—') + '</td>' +
        '<td class="muted">' + esc(r.title) + '</td>' +
        '<td>' + DAYS[r.day] + '</td>' +
        '<td class="mono">' + fmt(r.start) + '</td>' +
        '<td class="mono">' + (r.dur / 60) + 'h</td>' +
        '<td><span class="tag ' + (TYPE_CLASS[room.type] || 't-general') + '"></span>' + esc(room.name) +
          (r.isSplit ? ' <span class="pill neutral">+' + (r.splitCount - 1) + '</span>' : '') + '</td>' +
        '<td class="mono">' + (room.capacityKnown ? room.capacity : '—') + '</td>' +
        '<td class="mono">' + esc(r.weeksText) + '</td>' +
        (showChanged ? '<td>' + (chTxt ? '<span class="pill no">' + chTxt + '</span>'
          : '<span class="pill ok">same</span>') + '</td>' : '') +
        '</tr>';
    }).join('');
    document.getElementById('listnote').textContent = sorted.length > CAP
      ? 'Showing the first ' + CAP + ' of ' + sorted.length + ' rows — narrow the filters to see the rest.'
      : sorted.length + ' rows.';
  }

  function render() {
    if (tab === 'method') return;
    var list = rows().filter(matches);
    var roomSet = new Set(list.map(function (r) { return r.room; }));
    var split = list.filter(function (r) { return r.isSplit; }).length;
    var moved = list.filter(function (r) { return r.changed; }).length;
    document.getElementById('summary').innerHTML =
      '<strong>' + list.length.toLocaleString() + '</strong> bookings · ' +
      '<strong>' + roomSet.size + '</strong> rooms' +
      (split ? ' · <span class="warn" style="color:var(--warn);font-weight:600">' + split + '</span> split across rooms' : '') +
      (tab === 'springNew' && moved ? ' · <strong>' + moved + '</strong> moved from today' : '');
    if (view === 'grid') drawGrid(list); else drawList(list);
  }

  // ---------------- multi-select pickers ----------------
  //
  // One control, used for programmes, modules and rooms. Ticking keeps the list
  // open so several can be chosen without retyping, and each option carries the
  // number of bookings it would add under whatever else is already filtered —
  // so an option showing 0 is visibly not worth ticking.

  function makeMulti(rootId, cfg) {
    var root = document.getElementById(rootId);
    var box = root.querySelector('.box');
    var input = root.querySelector('input');
    var drop = root.querySelector('.drop');
    var sel = cfg.selection;

    function isOpen() { return drop.classList.contains('open'); }

    function close() {
      drop.classList.remove('open');
      input.setAttribute('aria-expanded', 'false');
    }

    function drawChips() {
      box.querySelectorAll('.chip').forEach(function (c) { c.remove(); });
      [...sel].forEach(function (v) {
        var chip = document.createElement('span');
        chip.className = 'chip on';
        chip.innerHTML = '<span>' + esc(cfg.label(v)) + '</span>' +
                         '<button type="button" aria-label="Remove ' + esc(cfg.label(v)) + '">\u00d7</button>';
        chip.querySelector('button').onclick = function (e) {
          e.stopPropagation();
          sel.delete(v);
          drawChips();
          if (isOpen()) drawOptions();
          onChange();
        };
        box.insertBefore(chip, input);
      });
    }

    function drawOptions() {
      var q = input.value.trim().toLowerCase();
      var counts = cfg.counts();
      var items = cfg.options().filter(function (v) {
        return !q || cfg.match(v, q);
      });
      // Ticked first, then busiest, so what is chosen stays visible.
      items.sort(function (a, b) {
        var sa = sel.has(a) ? 0 : 1, sb = sel.has(b) ? 0 : 1;
        if (sa !== sb) return sa - sb;
        var ca = counts.get(a) || 0, cb = counts.get(b) || 0;
        if (ca !== cb) return cb - ca;
        return String(cfg.label(a)).localeCompare(String(cfg.label(b)));
      });
      var shown = items.slice(0, 200);

      drop.innerHTML = shown.length
        ? shown.map(function (v) {
            var on = sel.has(v);
            var n = counts.get(v) || 0;
            return '<div class="opt' + (on ? ' on' : '') + '" role="option" aria-selected="' + on + '" data-v="' + esc(String(v)) + '">' +
              '<span class="tick" aria-hidden="true">' + (on ? '\u2713' : '') + '</span>' +
              '<span class="txt">' + cfg.optionHtml(v) + '</span>' +
              '<span class="cnt">' + n + '</span></div>';
          }).join('') + (items.length > shown.length
            ? '<div class="opt muted" style="cursor:default">' + (items.length - shown.length) + ' more — keep typing to narrow</div>'
            : '')
        : '<div class="opt muted" style="cursor:default">Nothing matches, in this term</div>';

      drop.querySelectorAll('.opt[data-v]').forEach(function (o) {
        o.onclick = function (e) {
          e.stopPropagation();
          var v = cfg.parse(o.dataset.v);
          if (sel.has(v)) sel.delete(v); else sel.add(v);
          drawChips();
          drawOptions();   // stays open, so several can be ticked in a row
          onChange();
          input.focus();
        };
      });

      drop.classList.add('open');
      input.setAttribute('aria-expanded', 'true');
    }

    function onChange() { render(); refreshAll(rootId); }

    input.addEventListener('focus', drawOptions);
    input.addEventListener('input', drawOptions);
    box.addEventListener('click', function (e) {
      if (e.target.closest('button')) return;
      input.focus();
      drawOptions();
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { close(); input.blur(); }
      // Backspace on an empty box removes the last chip, as chip inputs do.
      if (e.key === 'Backspace' && !input.value && sel.size) {
        var last = [...sel].pop();
        sel.delete(last);
        drawChips(); drawOptions(); onChange();
      }
    });
    document.addEventListener('click', function (e) {
      if (!root.contains(e.target)) close();
    });

    return {
      id: rootId,
      refresh: function () { drawChips(); if (isOpen()) drawOptions(); },
      redrawOptions: function () { if (isOpen()) drawOptions(); },
      clear: function () { sel.clear(); input.value = ''; close(); drawChips(); },
    };
  }

  var pickers = [];
  // After any filter changes, the other pickers' counts are stale.
  function refreshAll(exceptId) {
    pickers.forEach(function (p) { if (p.id !== exceptId) p.redrawOptions(); });
  }

  function countBy(skip, keyOf) {
    var counts = new Map();
    rows().forEach(function (r) {
      if (!matches(r, skip)) return;
      var k = keyOf(r);
      if (k === undefined || k === null || k === '') return;
      if (Array.isArray(k)) k.forEach(function (x) { counts.set(x, (counts.get(x) || 0) + 1); });
      else counts.set(k, (counts.get(k) || 0) + 1);
    });
    return counts;
  }

  // Options are limited to what the current tab actually contains, so a picker
  // never offers something that would give nothing.
  function presentIn(keyOf) {
    var seen = new Set();
    rows().forEach(function (r) {
      var k = keyOf(r);
      if (k === undefined || k === null || k === '') return;
      if (Array.isArray(k)) k.forEach(function (x) { seen.add(x); });
      else seen.add(k);
    });
    return [...seen];
  }

  function setupPickers() {
    pickers = [
      makeMulti('ms-prog', {
        selection: state.progs,
        options: function () { return presentIn(function (r) { return r.progs; }); },
        counts: function () { return countBy('progs', function (r) { return r.progs; }); },
        label: function (v) { return H.model.programmes[v]; },
        optionHtml: function (v) { return esc(H.model.programmes[v]); },
        match: function (v, q) { return H.model.programmes[v].toLowerCase().indexOf(q) >= 0; },
        parse: Number,
      }),
      makeMulti('ms-mod', {
        selection: state.modules,
        options: function () { return presentIn(function (r) { return r.module; }); },
        counts: function () { return countBy('modules', function (r) { return r.module; }); },
        label: function (v) { return v; },
        optionHtml: function (v) {
          var t = H.model.modTitles[v] || '';
          return '<b class="mono">' + esc(v) + '</b>' + (t ? ' <span class="muted">' + esc(t) + '</span>' : '');
        },
        match: function (v, q) {
          return v.toLowerCase().indexOf(q) >= 0 ||
                 (H.model.modTitles[v] || '').toLowerCase().indexOf(q) >= 0;
        },
        parse: String,
      }),
      makeMulti('ms-room', {
        selection: state.rooms,
        options: function () { return presentIn(function (r) { return r.room; }); },
        counts: function () { return countBy('rooms', function (r) { return r.room; }); },
        label: function (v) { return (H.model.rooms[v] || {}).name || String(v); },
        optionHtml: function (v) {
          var rm = H.model.rooms[v] || {};
          return '<span class="tag ' + (TYPE_CLASS[rm.type] || 't-general') + '"></span>' + esc(rm.name || v);
        },
        match: function (v, q) {
          return ((H.model.rooms[v] || {}).name || '').toLowerCase().indexOf(q) >= 0;
        },
        parse: Number,
      }),
    ];
    pickers.forEach(function (p) { p.refresh(); });
  }

  // ---------------- tabs ----------------
  function selectTab(key) {
    tab = key;
    document.querySelectorAll('#tabs .tab').forEach(function (b) {
      b.setAttribute('aria-selected', String(b.dataset.k === key));
    });
    var isMethod = key === 'method';
    ['filters', 'view-grid', 'view-list'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.hidden = isMethod || (id === 'view-grid' ? view !== 'grid' : id === 'view-list' ? view !== 'list' : false);
    });
    document.getElementById('summary').parentElement.hidden = isMethod;
    document.getElementById('method').hidden = !isMethod;

    document.getElementById('chip-changed').hidden = key !== 'springNew';
    document.getElementById('chip-split').hidden = key === 'springNew';
    if (key === 'springNew') { state.split = false; document.getElementById('chip-split').setAttribute('aria-pressed', 'false'); }
    else { state.changed = false; document.getElementById('chip-changed').setAttribute('aria-pressed', 'false'); }

    document.getElementById('legend-extra').textContent =
      key === 'springNew' ? 'Dashed edge = moved from today' : 'Outlined = same room double-booked';

    drawBanner();
    if (!isMethod) {
      // A different term has a different set of programmes, modules and rooms.
      pickers.forEach(function (p) { p.refresh(); });
      render();
    }
  }

  function drawBanner() {
    var el = document.getElementById('banner');
    if (tab === 'autumn') {
      el.innerHTML = '<div class="note"><p style="margin:0"><strong>Autumn 2026, as it stands.</strong> ' +
        'Shown for reference — the rebuild covers Spring only.</p></div>';
    } else if (tab === 'springNow') {
      el.innerHTML = '<div class="note warn"><p style="margin:0"><strong>Spring 2026, as it stands.</strong> ' +
        'Bookings marked <em>split across rooms</em> are the problem being fixed: one class ' +
        'occupying two or three rooms. Compare with the rebuilt tab.</p></div>';
    } else if (tab === 'springNew') {
      el.innerHTML = '<div id="verdict" class="note">Checking the rebuilt timetable in your browser…</div>';
      checkRebuild();
    } else {
      el.innerHTML = '';
    }
  }

  function checkRebuild() {
    var Cn = window.TTConstraints;
    var fixed = Cn.check(H.model, H.assign.solved, CHECK_OPTS);
    var mv = Cn.movement(H.model, H.assign.solved);
    var v = document.getElementById('verdict');
    if (!v) return;
    if (fixed.total === 0) {
      v.className = 'note good';
      v.innerHTML = '<p style="margin:0"><strong>Checked just now, in this browser: 0 violations across all ' +
        H.model.classes.length.toLocaleString() + ' classes.</strong> One room per class (exams aside, ' +
        'which may fill several), no cohort or lecturer in two places, every lecture and seminar ' +
        'back-to-back, and no new same-day pairings. ' +
        mv.untouched.toLocaleString() + ' of ' + mv.total.toLocaleString() +
        ' classes are exactly where they are today. <a href="#" id="to-method">How it was built</a>.</p>';
    } else {
      v.className = 'note warn';
      v.innerHTML = '<p style="margin:0"><strong>' + fixed.total +
        ' hard violations remain.</strong> This timetable is not clean.</p>';
    }
    var link = document.getElementById('to-method');
    if (link) link.onclick = function (e) { e.preventDefault(); selectTab('method'); };
  }

  // ---------------- boot ----------------
  M.loadTimetable().then(function (h) {
    H = h;
    Object.keys(H.terms).forEach(function (k) { markSplits(H.terms[k]); });

    var tabsEl = document.getElementById('tabs');
    TABS.forEach(function (k) {
      var t = H.terms[k];
      var b = document.createElement('button');
      b.className = 'tab';
      b.dataset.k = k;
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(k === tab));
      b.innerHTML = k === 'method'
        ? 'Method'
        : esc(t.label) + '<span class="sub">' + esc(t.sub) + '</span>';
      b.onclick = function () { selectTab(k); };
      tabsEl.appendChild(b);
    });

    setupPickers();

    var dayWrap = document.getElementById('f-days');
    ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].forEach(function (d, i) {
      var b = document.createElement('button');
      b.className = 'chip'; b.textContent = d; b.setAttribute('aria-pressed', 'false');
      b.onclick = function () {
        var on = b.getAttribute('aria-pressed') !== 'true';
        b.setAttribute('aria-pressed', String(on));
        if (on) state.days.add(i); else state.days.delete(i);
        render(); refreshAll();
      };
      dayWrap.appendChild(b);
    });

    var wk = document.getElementById('f-week');
    for (var w = 1; w <= 16; w++) {
      var o = document.createElement('option');
      o.value = String(w); o.textContent = 'Week ' + w;
      wk.appendChild(o);
    }
    wk.onchange = function () { state.week = wk.value; render(); refreshAll(); };

    document.querySelectorAll('#f-flags .chip').forEach(function (b) {
      b.onclick = function () {
        var on = b.getAttribute('aria-pressed') !== 'true';
        b.setAttribute('aria-pressed', String(on));
        state[b.dataset.f] = on;
        render(); refreshAll();
      };
    });

    var vg = document.getElementById('v-grid'), vl = document.getElementById('v-list');
    vg.onclick = function () {
      view = 'grid';
      vg.setAttribute('aria-pressed', 'true'); vl.setAttribute('aria-pressed', 'false');
      document.getElementById('view-grid').hidden = false;
      document.getElementById('view-list').hidden = true;
      render();
    };
    vl.onclick = function () {
      view = 'list';
      vl.setAttribute('aria-pressed', 'true'); vg.setAttribute('aria-pressed', 'false');
      document.getElementById('view-list').hidden = false;
      document.getElementById('view-grid').hidden = true;
      render();
    };

    document.getElementById('f-clear').onclick = function () {
      pickers.forEach(function (p) { p.clear(); });
      state.week = '';
      state.days.clear();
      state.changed = state.split = false;
      document.getElementById('f-week').value = '';
      document.querySelectorAll('#f-days .chip, #f-flags .chip').forEach(function (b) {
        b.setAttribute('aria-pressed', 'false');
      });
      render();
    };

    document.getElementById('method').innerHTML = window.TTMethod.html(H);
    selectTab('autumn');
  }).catch(function (e) {
    document.getElementById('banner').innerHTML =
      '<div class="note warn"><p style="margin:0">' + esc(e.message) + '</p></div>';
  });

  // Tooltip
  var tip = document.getElementById('tip');
  document.addEventListener('mouseover', function (e) {
    var b = e.target.closest('[data-tip]');
    if (b) { tip.innerHTML = esc(b.dataset.tip).replace(/\n/g, '<br>'); tip.style.opacity = '1'; }
  });
  document.addEventListener('mousemove', function (e) {
    var b = e.target.closest('[data-tip]');
    if (!b) { tip.style.opacity = '0'; return; }
    tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px';
    tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8) + 'px';
  });
})();
</script>
</body>
</html>
