<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timetable · Belfast Spring</title>
<meta name="description" content="Compare the current Spring 2026 Belfast timetable with the rebuilt one, by module, room or day.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%2316233d%27/%3E%3Cpath d=%27M9 8v10a7 7 0 0 0 14 0V8%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%273%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="appbar">
  <span class="mark" aria-hidden="true"></span>
  <h1>Belfast Spring Timetable</h1>
  <nav>
    <a href="index.html">The result</a>
    <a href="timetable.html" aria-current="page">Timetable</a>
    <a href="explore.html">Explore moves</a>
    <a href="method.html">Method</a>
  </nav>
</header>

<main class="wrap">

  <div class="row" style="margin-bottom:16px">
    <div class="chips" role="group" aria-label="Which timetable">
      <button class="chip" id="v-current" aria-pressed="false">Current</button>
      <button class="chip" id="v-solved" aria-pressed="true">Rebuilt</button>
    </div>
    <div class="chips" role="group" aria-label="View">
      <button class="chip" id="v-grid" aria-pressed="true">Week grid</button>
      <button class="chip" id="v-list" aria-pressed="false">List</button>
    </div>
  </div>

  <div class="card pad" style="margin-bottom:18px">
    <div class="grid3">
      <div>
        <label class="fld" for="f-module">Module</label>
        <input type="search" id="f-module" placeholder="e.g. CMM151, or part of a title" autocomplete="off">
      </div>
      <div>
        <label class="fld" for="f-room">Room</label>
        <input type="search" id="f-room" placeholder="e.g. BC-03-123" autocomplete="off">
      </div>
      <div>
        <label class="fld" for="f-week">Week</label>
        <select id="f-week"><option value="">All weeks</option></select>
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <span class="small muted" style="font-weight:600">Day</span>
      <div class="chips" id="f-days"></div>
      <span class="small muted" style="font-weight:600;margin-left:10px">Show</span>
      <div class="chips" id="f-flags">
        <button class="chip" data-f="teaching" aria-pressed="false">Teaching only</button>
        <button class="chip" data-f="changed" aria-pressed="false">Changed only</button>
        <button class="chip" data-f="split" aria-pressed="false">Split across rooms today</button>
      </div>
      <button id="f-clear" style="margin-left:auto">Clear</button>
    </div>
  </div>

  <p class="small" id="summary" style="min-height:22px"></p>

  <div id="view-grid">
    <div class="card gridcard"><div id="grid"></div></div>
    <div class="legend">
      <span class="k"><span class="tag t-general"></span>General</span>
      <span class="k"><span class="tag t-computer"></span>Computer lab</span>
      <span class="k"><span class="tag t-specialist"></span>Specialist</span>
      <span class="k"><span class="tag t-theatre"></span>Theatre</span>
      <span class="k" style="margin-left:auto">Dashed edge = moved from where it is today</span>
    </div>
  </div>

  <div id="view-list" hidden>
    <div class="card" style="overflow:hidden"><div class="scroll"><table id="lst"><thead></thead><tbody></tbody></table></div></div>
    <p class="small muted" id="listnote"></p>
  </div>

</main>

<div id="tip" role="tooltip"></div>

<footer>
  <div class="wrap">
    Weekend and non-teaching rows appear in List view only.
    One-off <code>BK</code> room bookings are excluded throughout.
  </div>
</footer>

<script src="assets/model.js"></script>
<script src="assets/constraints.js"></script>
<script>
(function () {
  'use strict';
  var M = window.TTModel, DAYS = M.DAYS, fmt = M.fmt;
  var TYPE_CLASS = { general: 't-general', computer: 't-computer', specialist: 't-specialist', theatre: 't-theatre' };

  var state = {
    which: 'solved', view: 'grid',
    module: '', room: '', week: '', days: new Set(),
    teaching: false, changed: false, split: false,
  };
  var H = null;

  function placementOf(c) {
    return state.which === 'solved'
      ? { day: c.day, start: c.start, room: c.room }
      : { day: c.origDay, start: c.origStart, room: c.origRoom };
  }

  function matches(c) {
    if (state.module) {
      var q = state.module.toLowerCase();
      if ((c.module || '').toLowerCase().indexOf(q) < 0 &&
          (c.title || '').toLowerCase().indexOf(q) < 0) return false;
    }
    var p = placementOf(c);
    if (state.room) {
      var rn = H.model.rooms[p.room] ? H.model.rooms[p.room].name.toLowerCase() : '';
      if (rn.indexOf(state.room.toLowerCase()) < 0) return false;
    }
    if (state.days.size && !state.days.has(p.day)) return false;
    if (state.week && !(c.weeks & (1 << (Number(state.week) - 1)))) return false;
    if (state.teaching && !c.isTeaching) return false;
    if (state.changed && !c.changed) return false;
    if (state.split && !c.isMultiRoom) return false;
    return true;
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
    });
  }

  // ---- week grid ----
  var PX = 0.74;

  function drawGrid(rows) {
    var el = document.getElementById('grid');
    var weekly = rows.filter(function (c) { return placementOf(c).day < 5; });
    if (!weekly.length) {
      el.innerHTML = '<div class="empty"><strong>Nothing matches.</strong>Widen the filters above.</div>';
      return;
    }
    if (weekly.length > 320) {
      el.innerHTML = '<div class="empty"><strong>' + weekly.length + ' classes match.</strong>' +
        'Narrow the filters to see the week grid, or switch to List.</div>';
      return;
    }

    // Fit the grid to what is on screen. Classes run from 07:15 to as late as
    // 23:15, so a fixed 08:00 origin draws early starts above the grid and over
    // the day headers; a fixed 23:00 end leaves most of the card empty.
    var lo = Infinity, hi = -Infinity;
    weekly.forEach(function (c) {
      var p = placementOf(c);
      if (p.start < lo) lo = p.start;
      if (p.start + c.dur > hi) hi = p.start + c.dur;
    });
    var T0 = Math.min(Math.floor(lo / 60) * 60, 9 * 60);
    var T1 = Math.max(Math.ceil(hi / 60) * 60, 18 * 60);
    var Hh = (T1 - T0) * PX;
    var html = '<div class="tt" style="height:' + (Hh + 32) + 'px"><div class="dh"></div>';
    for (var d = 0; d < 5; d++) html += '<div class="dh">' + DAYS[d] + '</div>';
    html += '<div class="timecol" style="height:' + Hh + 'px">';
    for (var h = T0 / 60; h <= T1 / 60; h++) {
      var y = (h * 60 - T0) * PX;
      html += '<div class="hr" style="top:' + y + 'px"></div>' +
              '<div class="hrl" style="top:' + y + 'px">' + String(h).padStart(2, '0') + ':00</div>';
    }
    html += '</div>';

    var byDay = [[], [], [], [], []];
    weekly.forEach(function (c) { byDay[placementOf(c).day].push(c); });

    for (var dd = 0; dd < 5; dd++) {
      html += '<div class="daycol" style="height:' + Hh + 'px">';
      var items = byDay[dd].map(function (c) {
        var p = placementOf(c);
        return { c: c, p: p, s: p.start, e: p.start + c.dur };
      }).sort(function (a, b) { return a.s - b.s || a.e - b.e; });

      // Flag genuine double-bookings so the current timetable's splits are visible.
      items.forEach(function (it) { it.clash = false; });
      for (var i = 0; i < items.length; i++) {
        for (var j = i + 1; j < items.length; j++) {
          var A = items[i], B = items[j];
          if (A.p.room !== B.p.room) continue;
          if (!(A.s < B.e && B.s < A.e)) continue;
          if (!(A.c.weeks & B.c.weeks)) continue;
          A.clash = B.clash = true;
        }
      }

      // Lay overlapping blocks side by side.
      var clusters = [], cur = [], curEnd = -1;
      items.forEach(function (it) {
        if (it.s >= curEnd && cur.length) { clusters.push(cur); cur = []; curEnd = -1; }
        cur.push(it); curEnd = Math.max(curEnd, it.e);
      });
      if (cur.length) clusters.push(cur);

      clusters.forEach(function (cl) {
        var colEnd = [];
        cl.forEach(function (it) {
          for (var k = 0; k < colEnd.length; k++) {
            if (colEnd[k] <= it.s) { it.col = k; colEnd[k] = it.e; return; }
          }
          it.col = colEnd.length; colEnd.push(it.e);
        });
        var nc = colEnd.length;
        cl.forEach(function (it) {
          var c = it.c, room = H.model.rooms[it.p.room];
          var top = (it.s - T0) * PX, ht = Math.max((it.e - it.s) * PX - 2, 14);
          var w = 100 / nc, left = it.col * w;
          var colr = 'var(--' + (TYPE_CLASS[room.type] || 't-general').replace('t-', 't-') + ')';
          var changed = state.which === 'solved' ? c.changed : '';
          var chLabel = changed ? ['day', 'time', 'room'].filter(function (x, ix) {
            return changed.indexOf(['d', 't', 'r'][ix]) >= 0;
          }).join(', ') : '';
          var tip = (c.module || c.activity) + ' · ' + c.activity + '\n' +
                    fmt(it.s) + '–' + fmt(it.e) + '\n' + room.name +
                    (room.capacityKnown ? ' · ' + room.capacity + ' seats' : ' · capacity not recorded') +
                    '\nWeeks ' + c.weeksText +
                    (chLabel ? '\nMoved: ' + chLabel : '') +
                    '\n' + c.title;
          html += '<div class="blk' + (it.clash ? ' clash' : '') + (changed ? ' moved' : '') +
            '" style="top:' + top + 'px;height:' + ht + 'px;left:calc(' + left + '% + 1px);' +
            'width:calc(' + w + '% - 2px);border-left-color:' + colr + '" data-tip="' + esc(tip) + '">' +
            '<div class="m">' + esc(c.module || c.activity) + '</div>' +
            '<div class="r">' + esc(room.name) + '</div>' +
            (chLabel && ht > 32 ? '<div class="c">moved ' + chLabel + '</div>' : '') +
            '</div>';
        });
      });
      html += '</div>';
    }
    html += '</div>';
    el.innerHTML = html;
  }

  // ---- list ----
  var sortKey = 'day', sortDir = 1;
  var COLS = [
    ['Module', 'module'], ['Title', 'title'], ['Day', 'day'], ['Start', 'start'],
    ['Length', 'dur'], ['Room', 'room'], ['Seats', 'seats'], ['Weeks', 'weeks'], ['Changed', 'changed'],
  ];

  function drawList(rows) {
    var th = document.querySelector('#lst thead'), tb = document.querySelector('#lst tbody');
    th.innerHTML = '<tr>' + COLS.map(function (c) {
      return '<th data-k="' + c[1] + '">' + c[0] + (sortKey === c[1] ? (sortDir > 0 ? ' ▲' : ' ▼') : '') + '</th>';
    }).join('') + '</tr>';
    th.querySelectorAll('th').forEach(function (h) {
      h.onclick = function () {
        var k = h.dataset.k;
        if (k === sortKey) sortDir *= -1; else { sortKey = k; sortDir = 1; }
        render();
      };
    });

    var val = function (c) {
      var p = placementOf(c);
      switch (sortKey) {
        case 'module': return c.module || c.activity;
        case 'title': return c.title;
        case 'day': return p.day * 10000 + p.start;
        case 'start': return p.start;
        case 'dur': return c.dur;
        case 'room': return H.model.rooms[p.room].name;
        case 'seats': return H.model.rooms[p.room].capacity;
        case 'weeks': return c.weeksText;
        case 'changed': return c.changed || '';
        default: return 0;
      }
    };
    var sorted = rows.slice().sort(function (a, b) {
      var va = val(a), vb = val(b);
      return (va > vb ? 1 : va < vb ? -1 : 0) * sortDir;
    });
    var CAP = 800, show = sorted.slice(0, CAP);
    tb.innerHTML = show.map(function (c) {
      var p = placementOf(c), room = H.model.rooms[p.room];
      var changed = state.which === 'solved' ? c.changed : '';
      var chTxt = changed ? ['d', 't', 'r'].filter(function (x) { return changed.indexOf(x) >= 0; })
        .map(function (x) { return { d: 'day', t: 'time', r: 'room' }[x]; }).join(', ') : '';
      return '<tr>' +
        '<td class="mono">' + esc(c.module || '—') + '</td>' +
        '<td class="muted">' + esc(c.title) + '</td>' +
        '<td>' + DAYS[p.day] + '</td>' +
        '<td class="mono">' + fmt(p.start) + '</td>' +
        '<td class="mono">' + (c.dur / 60) + 'h</td>' +
        '<td><span class="tag ' + (TYPE_CLASS[room.type] || 't-general') + '"></span>' + esc(room.name) + '</td>' +
        '<td class="mono">' + (room.capacityKnown ? room.capacity : '—') + '</td>' +
        '<td class="mono">' + esc(c.weeksText) + '</td>' +
        '<td>' + (chTxt ? '<span class="pill no">' + chTxt + '</span>' : '<span class="pill neutral">same</span>') + '</td>' +
        '</tr>';
    }).join('');
    document.getElementById('listnote').textContent = sorted.length > CAP
      ? 'Showing the first ' + CAP + ' of ' + sorted.length + ' rows — narrow the filters to see the rest.'
      : sorted.length + ' rows.';
  }

  function render() {
    var rows = H.model.classes.filter(matches);
    var rooms = new Set(rows.map(function (c) { return placementOf(c).room; }));
    var changed = rows.filter(function (c) { return state.which === 'solved' && c.changed; }).length;
    document.getElementById('summary').innerHTML =
      '<strong>' + rows.length.toLocaleString() + '</strong> classes · ' +
      '<strong>' + rooms.size + '</strong> rooms' +
      (state.which === 'solved' ? ' · <strong>' + changed + '</strong> moved from today' : '') +
      (state.which === 'current' ? ' · showing the timetable as it stands' : '');
    if (state.view === 'grid') drawGrid(rows); else drawList(rows);
  }

  function bindChip(el, on) {
    el.onclick = function () { on(el.getAttribute('aria-pressed') !== 'true'); render(); };
  }

  M.loadTimetable().then(function (h) {
    H = h;

    var dayWrap = document.getElementById('f-days');
    ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].forEach(function (d, i) {
      var b = document.createElement('button');
      b.className = 'chip'; b.textContent = d; b.setAttribute('aria-pressed', 'false');
      b.onclick = function () {
        var on = b.getAttribute('aria-pressed') !== 'true';
        b.setAttribute('aria-pressed', String(on));
        if (on) state.days.add(i); else state.days.delete(i);
        render();
      };
      dayWrap.appendChild(b);
    });

    var wk = document.getElementById('f-week');
    for (var w = 1; w <= 16; w++) {
      var o = document.createElement('option');
      o.value = String(w); o.textContent = 'Week ' + w;
      wk.appendChild(o);
    }
    wk.onchange = function () { state.week = wk.value; render(); };

    document.getElementById('f-module').oninput = function (e) { state.module = e.target.value.trim(); render(); };
    document.getElementById('f-room').oninput = function (e) { state.room = e.target.value.trim(); render(); };

    document.querySelectorAll('#f-flags .chip').forEach(function (b) {
      b.onclick = function () {
        var on = b.getAttribute('aria-pressed') !== 'true';
        b.setAttribute('aria-pressed', String(on));
        state[b.dataset.f] = on;
        render();
      };
    });

    var vc = document.getElementById('v-current'), vs = document.getElementById('v-solved');
    vc.onclick = function () {
      state.which = 'current';
      vc.setAttribute('aria-pressed', 'true'); vs.setAttribute('aria-pressed', 'false');
      render();
    };
    vs.onclick = function () {
      state.which = 'solved';
      vs.setAttribute('aria-pressed', 'true'); vc.setAttribute('aria-pressed', 'false');
      render();
    };

    var vg = document.getElementById('v-grid'), vl = document.getElementById('v-list');
    vg.onclick = function () {
      state.view = 'grid';
      vg.setAttribute('aria-pressed', 'true'); vl.setAttribute('aria-pressed', 'false');
      document.getElementById('view-grid').hidden = false;
      document.getElementById('view-list').hidden = true;
      render();
    };
    vl.onclick = function () {
      state.view = 'list';
      vl.setAttribute('aria-pressed', 'true'); vg.setAttribute('aria-pressed', 'false');
      document.getElementById('view-list').hidden = false;
      document.getElementById('view-grid').hidden = true;
      render();
    };

    document.getElementById('f-clear').onclick = function () {
      state.module = state.room = state.week = '';
      state.days.clear();
      state.teaching = state.changed = state.split = false;
      document.getElementById('f-module').value = '';
      document.getElementById('f-room').value = '';
      document.getElementById('f-week').value = '';
      document.querySelectorAll('#f-days .chip, #f-flags .chip').forEach(function (b) {
        b.setAttribute('aria-pressed', 'false');
      });
      render();
    };

    // Start on something legible rather than 1,500 blocks.
    document.getElementById('f-module').value = 'CMM';
    state.module = 'CMM';
    render();
  }).catch(function (e) {
    document.getElementById('summary').textContent = e.message;
  });

  // Tooltip
  var tip = document.getElementById('tip');
  document.addEventListener('mouseover', function (e) {
    var b = e.target.closest('[data-tip]');
    if (b) { tip.innerHTML = esc(b.dataset.tip).replace(/\n/g, '<br>'); tip.style.opacity = '1'; }
  });
  document.addEventListener('mousemove', function (e) {
    var b = e.target.closest('[data-tip]');
    if (!b) { tip.style.opacity = '0'; return; }
    tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px';
    tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8) + 'px';
  });
})();
</script>
</body>
</html>
